[metadata]
family = "realtime_forecasting"
name   = "realtime_stock_forecasting"

[curated]
class_name = "RealtimeStockForecasting"

[curated.default_config]
symbols         = ["SPY", "QQQ", "IWM"]
target_symbols  = ["SPY", "QQQ"]
# Prediction horizon in bars of `data_resolution` (below). 5 × 1m = the
# close 5 minutes ahead. Set data_resolution = "1h"/"1d" to resolve on
# the hourly/daily close instead.
horizon_bars    = 5
context_resolutions = [
    { interval = "1m", bars = 60 },
    { interval = "5m", bars = 24 },
    { interval = "1h", bars = 24 },
]
data_resolution = "1m"
headline_metric = "price_mape"

[environment]
# Shared sandbox image, same across every curated + generated task.
# Singularity (HPC / K8s) requires a registry image; Docker pulls it too
# under the default flow. The image is task-agnostic — task data is
# bind-mounted into /data at trial-launch by the orchestrator
# (openfinai_harbor.runner.build_task_data_mount).
docker_image = "nihao0630/openfinai-base:v1"
