# Phase 1c trading-paper triage descriptor for offline_crypto_trading.
#
# Read by openfinai_pipeline.papers._curated_catalog at the start of every
# triage-trading-papers run. Lifted out of task.toml so the runtime config
# (sibling task.toml) stays lean. All triage-only data — structural fields,
# per-config-schema-field metadata, and LLM-prompt prose — lives here in
# one place. Editing any field invalidates the catalog SHA256 stamped onto
# every TradingTriageRecord; that drift is visible to downstream consumers.
#
# task_id and class_name are pulled from the sibling task.toml's
# [metadata].name and [curated].class_name respectively (no duplication).

schema_version  = "1"
triage_eligible = true
asset_classes   = ["crypto"]
exchanges       = ["binance"]
mode            = "offline"
action_space_description = """\
Transactional orders: a dict with keys 'action' ('buy'|'sell'|'hold'|'cancel'), \
'symbol', 'quantity' (>0, fractional allowed), 'order_type' \
('market'|'limit'|'stop'|'stop_limit', default 'market'), 'limit_price', \
'stop_price', 'tif' ('ioc'|'gtc', default 'gtc'), and 'order_id' for cancels. \
Use `{'orders': [<intent>, ...]}` to submit / cancel multiple orders in one step. \
Shorting is allowed (sell beyond your holdings) and orders are capped by buying \
power (strict 1x). Limit/stop orders queue across bars (GTC) or expire same-bar \
(IOC); fills are pessimistic at limit_price / stop_price."""
task_description = """\
Sequential trading on historical Binance spot OHLCV. The agent issues per-bar \
trading actions across a fixed symbol universe. Crypto markets are 24/7, \
so any interval from 1m through 1w is supported with continuous bars. Score is \
PnL (mark-to-market across the episode); diagnostics include Sharpe ratio, max \
drawdown, win rate, and total return."""
action_format_description = """\
The episode is an interactive session: reset, then submit one action per bar from \
the observation you are given (no look-ahead). A transactional intent dict (e.g. \
`{\"action\": \"buy\", \"symbol\": \"BTCUSDT\", \"quantity\": 0.1, \"order_type\": \
\"limit\", \"limit_price\": 49000.0, \"tif\": \"gtc\"}`), or `{\"action\": \"hold\"}` \
to do nothing. Size quantity to your buying power (e.g. ~`0.95 * cash / price`). \
Pending GTC orders carry across bars and are auto-expired at episode end; cancel \
via `{\"action\": \"cancel\", \"order_id\": <id>}`."""
evaluation_description = """\
Headline metric: PnL (mean per-bar mark-to-market). Diagnostics: sharpe_ratio, \
max_drawdown, win_rate, total_return."""

[config_schema.symbols]
type     = "list[str]"
required = true
examples = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT", "ADAUSDT"]
notes    = "Binance spot ticker codes (concatenated, no '/' separator); USDT-quoted pairs preferred."

[config_schema.target_symbols]
type     = "list[str]"
required = true
notes    = "Subset of `symbols` on which PnL/Sharpe/drawdown/win-rate are scored. Trades on non-target symbols are still allowed (hedging) but excluded from metrics."

[config_schema.context_resolutions]
type             = "list[{interval, bars}]"
required         = true
interval_options = ["1m", "5m", "15m", "30m", "1h", "4h", "1d", "1w"]
notes            = "Multi-timeframe observation; each entry adds an obs key `recent_bars_by_interval[interval]`. The finest interval must match `data_resolution`."

[config_schema.data_resolution]
type    = "str"
required = true
notes   = "Primary buffer cadence; must equal the finest interval in `context_resolutions`. Drives per-step PnL and verifier replay. Controls data buffering only — agents step at any frequency they wish."

[config_schema.start]
type     = "date"
required = true
format   = "YYYY-MM-DD"
notes    = "Backtest start (inclusive). Date-only defaults to 00:00 UTC; pass full ISO for sub-daily precision."

[config_schema.end]
type     = "date"
required = true
format   = "YYYY-MM-DD"
notes    = "Backtest end (exclusive)."

[config_schema.initial_cash]
type    = "float"
default = 100000.0
notes   = "Starting cash in quote currency (USDT). Orders are buying-power-capped (strict 1x), so set this relative to the traded price."

[config_schema.episode_length]
type     = "int"
required = true
notes    = "Number of `data_resolution` bars per episode."

[config_schema.slippage_pct]
type    = "float"
default = 0.0
notes   = "Per-trade slippage as fraction of notional (e.g. 0.0005 = 5 bps)."

[config_schema.transaction_cost_pct]
type    = "float"
default = 0.0
notes   = "Per-trade commission as fraction of notional (e.g. 0.001 = 10 bps round-trip)."

[config_schema.order_types]
type    = "list[str]"
default = ["market", "limit", "stop", "stop_limit"]
notes   = "Supported order types. Always all four."

[config_schema.time_in_force]
type    = "list[str]"
default = ["ioc", "gtc"]
notes   = "Supported time-in-force values for limit/stop/stop_limit orders. `gtc` (default) carries across bars until filled, cancelled, or auto-expired at episode end. `ioc` fills against the same bar's OHLC or expires immediately."

[catalog_defaults]
symbols              = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
target_symbols       = ["BTCUSDT", "ETHUSDT"]
context_resolutions  = [
    { interval = "1h", bars = 20 },
    { interval = "4h", bars = 24 },
    { interval = "1d", bars = 14 },
]
data_resolution      = "1h"
start                = "2020-01-01"
end                  = "2023-01-01"
initial_cash         = 100000.0
episode_length       = 200
start_offset         = 0
slippage_pct         = 0.0
transaction_cost_pct = 0.0
